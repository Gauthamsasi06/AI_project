let seconds = 18, phase = 2;
const phases = [
 {name:"RED PHASE",hint:"Vehicles are stopping safely.",color:"red",duration:26,queue:24},
 {name:"AMBER PHASE",hint:"Prepare for the next traffic phase.",color:"yellow",duration:4,queue:18},
 {name:"GREEN PHASE",hint:"Traffic flow is moving smoothly.",color:"green",duration:18,queue:12}
];
function setPhase(){
 const p=phases[phase]; seconds=p.duration;
 document.getElementById("signalState").textContent=p.name;
 document.getElementById("signalHint").innerHTML=p.hint+"<br>Next phase in";
 document.getElementById("countdown").textContent=seconds;
 document.getElementById("queue").textContent=p.queue+" vehicles";
 document.querySelectorAll("#bigSignal .bulb").forEach(b=>b.classList.remove("on"));
 document.querySelector("#bigSignal .bulb."+p.color).classList.add("on");
}
setInterval(()=>{
 const now=new Date();
 document.getElementById("clock").textContent=now.toLocaleTimeString("en-GB");
 document.getElementById("mapTime").textContent="SYNC "+now.toLocaleTimeString("en-GB");
 seconds--;
 if(seconds<=0){phase=(phase+1)%phases.length;setPhase()} else document.getElementById("countdown").textContent=seconds;
},1000);

function toast(message){const el=document.getElementById("toast");el.textContent=message;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2500)}
document.getElementById("refreshBtn").addEventListener("click",()=>{
 const congestion=28+Math.floor(Math.random()*20), speed=(28+Math.random()*8).toFixed(1), vehicles=(23000+Math.floor(Math.random()*4000)).toLocaleString("en-US");
 document.getElementById("congestion").innerHTML=congestion+'<span style="font-size:15px">%</span>';
 document.getElementById("speed").innerHTML=speed+' <span style="font-size:14px">km/h</span>';
 document.getElementById("vehicles").textContent=vehicles;
 document.getElementById("syncTime").textContent="just now";
 const randomized=chartData.map(d=>({...d,v:Math.max(15,Math.min(96,d.v+Math.floor(Math.random()*17)-8))}));
 renderChart(randomized);
 document.getElementById("forecastStatus").textContent=congestion>40?"↗ rising demand":"↘ easing ahead";
 toast("Demo traffic values refreshed");
});
document.getElementById("citySelect").addEventListener("change",e=>{
 const city=e.target.value;
 document.querySelector(".map-chip").textContent="◉  "+city.toUpperCase()+" / OVERVIEW";
 document.querySelector(".card-sub").textContent="Live-style camera imagery + predicted flow overlays";
 toast("Switched dashboard view to "+city+" · demo data");
});
</script>
</body>
</html>
